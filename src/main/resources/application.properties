# Database Configuration (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jornalBD}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.maximum-pool-size=10

# Server
server.port=${PORT:8080}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=*
cors.exposed-headers=Content-Type,Content-Length,Content-Disposition
cors.allow-credentials=true
cors.max-age=3600

# File upload directories (use forward slashes or system-agnostic)
file.upload-dir=${FILE_UPLOAD_DIR:C:/Projetos/itensEncarteFacil}
file.produtos-dir=${file.upload-dir}/imagens/produtos/
file.temas-dir=${file.upload-dir}/imagens/temas/
file.rodapes-dir=${file.upload-dir}/imagens/rodapes/
file.placeholders-dir=${file.upload-dir}/placeholders/
file.placeholder-path=${file.placeholders-dir}/product-placeholder.jpg

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# File upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging
logging.level.root=INFO
logging.level.gonzaga.jornalfacil=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# SSR Configuration (sera removido na fase de PDF em Java puro)
ssr.server.url=${SSR_SERVER_URL:http://localhost:3001}
ssr.timeout.connect=10000
ssr.timeout.read=45000

# Report Configuration
relatorio.export.dir=${RELATORIO_EXPORT_DIR:./relatorios}
relatorio.retention.days=365
