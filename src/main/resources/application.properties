# Configuração simplificada do banco de dados
spring.datasource.url=jdbc:mysql://localhost:3307/jornalBD?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=senha123

# Server
server.port=8080

# CORS
#cors.allowed-origins=http://localhost:3000
cors.allowed-origins=http://localhost:3000,http://localhost:5173
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=*
cors.exposed-headers=Content-Type,Content-Length,Content-Disposition
cors.allow-credentials=true
cors.max-age=3600

# Configuração corrigida dos diretórios
file.upload-dir=E:/itensEncarteFacil
file.produtos-dir=${file.upload-dir}/imagens/produtos/
file.temas-dir=${file.upload-dir}/imagens/temas/
file.rodapes-dir=${file.upload-dir}/imagens/rodapes/
file.placeholders-dir=${file.upload-dir}/placeholders/
file.placeholder-path=${file.placeholders-dir}/product-placeholder.jpg


# Configuração básica do JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuração simplificada do Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Allow Flyway to continue even if migrations are out of order
spring.flyway.out-of-order=true

# Baseline an existing database
spring.flyway.baselie=true
spring.flyway.validate-on-migrate=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Aumente o buffer do Tomcat
server.tomcat.max-swallow-size=10MB
server.tomcat.max-http-form-post-size=10MB

# Configuração de logging para debug de imagens e PDF
logging.level.redeinova.jornalfacil.service.PdfService=DEBUG
logging.level.redeinova.jornalfacil.util.ImageConverter=DEBUG
logging.level.com.lowagie=WARN

## Configuração para tratar WebP (se necessário)
#imageio.webp.encoder=com.luciad.imageio.webp.WebPImageWriterSpi
#imageio.webp.decoder=com.luciad.imageio.webp.WebPImageReaderSpi

# Adicionar suporte a formatos básicos
imageio.png.encoder=com.sun.imageio.plugins.png.PNGImageWriterSpi
imageio.png.decoder=com.sun.imageio.plugins.png.PNGImageReaderSpi


