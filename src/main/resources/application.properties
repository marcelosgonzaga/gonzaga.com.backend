# Configuração simplificada do banco de dados
spring.datasource.url=jdbc:mysql://localhost:3307/jornalBD?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
#spring.datasource.url=jdbc:mysql://localhost:3307/jornalBD?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=5000&socketTimeout=30000
spring.datasource.username=root
spring.datasource.password=senha123

# Server
server.port=8080

# CORS
cors.allowed-origins=http://localhost:3000
file.upload-dir=E:/itensEncarteFacil

# Configuração básica do JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuração simplificada do Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Allow Flyway to continue even if migrations are out of order
spring.flyway.out-of-order=true

# Baseline an existing database
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

#file.upload-dir=E:/projetos/jornal-facil/uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Aumente o buffer do Tomcat
server.tomcat.max-swallow-size=10MB
server.tomcat.max-http-form-post-size=10MB






