# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3307/jornalBD?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=senha123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Ensure database driver is loaded
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.maximum-pool-size=10

# Server
server.port=8080

# CORS
cors.allowed-origins=http://localhost:3000,http://localhost:5173
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=*
cors.exposed-headers=Content-Type,Content-Length,Content-Disposition
cors.allow-credentials=true
cors.max-age=3600

# File upload directories (use forward slashes or system-agnostic)
file.upload-dir=C:/Projetos/itensEncarteFacil
file.produtos-dir=${file.upload-dir}/imagens/produtos/
file.temas-dir=${file.upload-dir}/imagens/temas/
file.rodapes-dir=${file.upload-dir}/imagens/rodapes/
file.placeholders-dir=${file.upload-dir}/placeholders/
file.placeholder-path=${file.placeholders-dir}/product-placeholder.jpg

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
#spring.jpa.properties.hibernate.format_sql=true
#
# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=jornalBD
spring.flyway.create-schemas=true

# File upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging
logging.level.root=INFO
logging.level.gonzaga.jornalfacil=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type=TRACE

# SSR Configuration
ssr.server.url=http://localhost:3001
ssr.timeout.connect=10000
ssr.timeout.read=45000

# Report Configuration
relatorio.export.dir=./relatorios
relatorio.retention.days=365

# Debug property to see what's being loaded
debug=true





